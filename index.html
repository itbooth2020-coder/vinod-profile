    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        // Palette, font and custom colors chosen in the Customize panel (see ThemePicker.jsx).
        var s = JSON.parse(localStorage.getItem('site-theme') || '{}'), r = document.documentElement
        if (s.palette) r.dataset.palette = s.palette
        if (s.font) r.dataset.font = s.font
        if (s.accent) r.style.setProperty('--accent', s.accent)
        if (s.accent2) r.style.setProperty('--accent2', s.accent2)
        // The default font, Inter, is self-hosted (public/fonts); preload it only when it will be used.
        if (!s.font || s.font === 'inter') {
          var p = document.createElement('link')
          p.rel = 'preload'
          p.as = 'font'
          p.type = 'font/woff2'
          p.href = '/fonts/inter-latin-var.woff2'
          p.crossOrigin = 'anonymous'
          document.head.appendChild(p)
        }
        // A saved non-default font: fetch its stylesheet from Google Fonts now (disclosed in
        // public/privacy.html). Keep in sync with FONTS in ThemePicker.jsx.
        var f = {
          grotesk: 'Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600',
          plex: 'IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600',
          serif: 'Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600',
        }[s.font]
        if (f) {
          var l = document.createElement('link')
          l.id = 'font-' + s.font
          l.rel = 'stylesheet'
          l.href = 'https://fonts.googleapis.com/css2?family=' + f + '&display=swap'
          document.head.appendChild(l)
        }
      } catch (e) {}
      // "Pause animations": saved choice, else the reduced-motion preference (see src/hooks/useMotion.js).
      try {
        var m = localStorage.getItem('motion-paused')
        if (m === '1' || (m !== '0' && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.dataset.motion = 'paused'
      } catch (e) {}
      // Until the app mounts, only the prerendered header and hero are shown, so they paint without
      // laying out the whole page first (styles.css; App.jsx removes it). Without JavaScript all of it shows.
      document.documentElement.dataset.app = 'pending'
      // Shareable 30-second brief (?brief=1): switch before first paint to avoid a flash (see App.jsx).
      try {
        if (new URLSearchParams(location.search).get('brief') === '1') document.documentElement.dataset.mode = 'brief'
      } catch (e) {}
      // Fail open (FUNC-013): if the app hasn't mounted because its bundle failed to load (blocked,
      // deploy race) or threw before mounting, show the whole prerendered page like the no-JavaScript
      // view (data-app="failed", styles below). The brief needs the app, so this also leaves brief mode. A late mount
      // still takes over (App.jsx removes data-app and reads ?brief=1 itself).
      ;(function () {
        var r = document.documentElement
        var fail = function () {
          if (r.dataset.app !== 'pending') return
          r.dataset.app = 'failed'
          delete r.dataset.mode
        }
        setTimeout(fail, 4000)
        addEventListener('error', function (e) {
          var t = e.target
          if (t === window || (t && t.tagName === 'SCRIPT')) fail()
        }, true)
        // Hydration waits a frame after the bundle runs (main.jsx), so allow a moment after load.
        addEventListener('load', function () { setTimeout(fail, 1500) })
      })()
    </script>
    <style>
      /* Inter (SIL OFL 1.1, public/fonts/OFL.txt): one self-hosted variable file, Latin subset, weights
         400-700. 'Inter Fallback' is Arial resized to Inter's metrics, so the swap barely shifts text.
         Other Customize fonts load from Google Fonts only when a visitor picks one (ThemePicker.jsx). */
      @font-face { font-family: Inter; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/inter-latin-var.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('ArialMT'), local('Helvetica'), local('Arimo'); size-adjust: 107.12%; ascent-override: 90.44%; descent-override: 22.52%; line-gap-override: 0%; }
      /* The app failed to mount (data-app="failed", script above): the same static page as <noscript>. */
      :root[data-app='failed'] .counter__final { visibility: visible !important; } :root[data-app='failed'] .counter__live { visibility: hidden !important; }
      :root[data-app='failed'] .hero .lede { display: block !important; }
      :root[data-app='failed'] :is(.header__tools, .nav__vince, .hero__top, .lede__more, .glance__more, .case-open, .card__head .icon-btn, .lazy-ph, .vince-dock, .progress) { display: none !important; }
    </style>
    <noscript>
      <!-- Without JavaScript the prerendered page (vite.config.js) is static: show the counters' final
           values and the full pitch, and hide the controls and sections that need the app. -->
      <style>
        .counter__final { visibility: visible !important; } .counter__live { visibility: hidden !important; }
        .hero .lede { display: block !important; }
        .header__tools, .nav__vince, .hero__top, .lede__more, .glance__more, .case-open, .card__head .icon-btn, .lazy-ph, .vince-dock, .progress { display: none !important; }
      </style>
    </noscript>
