<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vinod Pyarelal Yadav - Engineering Manager at Accenture with 14+ years leading mobile, IoT, MDM, AI-agent and web platforms. Ask the AI profile agent anything about his experience." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="Vinod Pyarelal Yadav | Engineering Manager" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%230b0e14%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27%233dd6c6%27 font-family=%27monospace%27 font-weight=%27700%27%3E%3E%3C/text%3E%3C/svg%3E" />
    <title>Vinod Pyarelal Yadav | Engineering Manager</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
        // Palette, font and custom colors chosen in the Customize panel (see ThemePicker.jsx).
        var s = JSON.parse(localStorage.getItem('site-theme') || '{}'), r = document.documentElement
        if (s.palette) r.dataset.palette = s.palette
        if (s.font) r.dataset.font = s.font
        if (s.accent) r.style.setProperty('--accent', s.accent)
        if (s.accent2) r.style.setProperty('--accent2', s.accent2)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
