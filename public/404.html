<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e14" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Page not found · Vinod Pyarelal Yadav</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Served by CloudFront (status 404) for unknown paths. Standalone: no React, no external requests. -->
    <style>
      :root {
        --bg: #0b0e14; --panel: #121722; --border: #2a3448; --text: #e8ecf4; --muted: #a3adc2;
        --accent: #3dd6c6; --accent-ink: #0b0e14;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f4f6fb; --panel: #ffffff; --border: #c7cfe0; --text: #1a2033; --muted: #4d5670; --accent: #0b6e64; --accent-ink: #ffffff; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--text); line-height: 1.55;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; }
      .code { margin: 0 0 4px; font: 600 14px ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; color: var(--accent); }
      h1 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.25; }
      p { margin: 0 0 20px; color: var(--muted); }
      nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
      a {
        display: inline-block; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
        color: var(--text); text-decoration: none; font-weight: 600;
      }
      a:hover { border-color: var(--accent); }
      a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      @media (max-width: 400px) { nav ul { flex-direction: column; } a { display: block; text-align: center; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This page doesn't exist on Vinod Pyarelal Yadav's profile site. It may have moved, or the link may be mistyped.</p>
      <nav aria-label="Helpful links">
        <ul>
          <li><a class="primary" href="/">Home</a></li>
          <li><a href="/?brief=1">30-second brief</a></li>
          <li><a href="/privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
