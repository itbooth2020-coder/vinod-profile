<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinod Pyarelal Yadav - IDE editor theme sample</title>
<meta name="color-scheme" content="dark light">
<!-- Ideas only (no code copied): editor layout conventions from VS Code's UI, palette structure inspired by primer/github-vscode-theme (MIT). All code is original. -->
<style>
:root{
  --bg:#1e1e1e;--side:#252526;--act:#333333;--tab:#2d2d2d;--border:#3c3c3c;--text:#d4d4d4;--muted:#a0a0a0;
  --accent:#4fa3ff;--accent-ink:#0b0b0b;--status:#0e639c;--status-ink:#ffffff;
  --k:#9cdcfe;--s:#ce9178;--n:#b5cea8;--kw:#c586c0;--c:#8a8a8a;--ty:#4ec9b0;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=light]{
  --bg:#ffffff;--side:#f3f3f3;--act:#e4e4e4;--tab:#ececec;--border:#c8c8c8;--text:#1f1f1f;--muted:#5a5a5a;
  --accent:#0451a5;--accent-ink:#ffffff;--status:#005a9e;--status-ink:#ffffff;
  --k:#0451a5;--s:#a31515;--n:#0b6b3a;--kw:#af00db;--c:#616161;--ty:#0f6c6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:9}.skip:focus{left:0}
.ide{display:grid;grid-template-columns:48px 240px 1fr;grid-template-rows:auto 1fr auto;min-height:100vh}
.title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--act);border-bottom:1px solid var(--border);padding:6px 12px;font:13px var(--mono);color:var(--muted)}
.title b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.toggle{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;min-height:32px;font:12px var(--mono);color:var(--text)}
.toggle:hover{border-color:var(--accent)}
.act{background:var(--act);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:14px;color:var(--muted);font:16px var(--mono)}
.act span{width:28px;height:28px;display:grid;place-items:center;border-left:2px solid transparent}.act span:first-child{border-color:var(--accent);color:var(--text)}
.side{background:var(--side);border-right:1px solid var(--border);padding:10px 0;font:13.5px var(--mono)}
.side h2{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 14px 8px}
.tree{list-style:none;margin:0;padding:0}
.tree button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 14px 6px 22px;min-height:32px}
.tree button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tree button[aria-selected=true]{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text)}
.ico{font-size:11px;font-weight:700}.j{color:var(--s)}.t{color:var(--ty)}.m{color:var(--k)}
.main{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;background:var(--tab);overflow-x:auto;border-bottom:1px solid var(--border)}
.tabs button{background:var(--tab);border:0;border-right:1px solid var(--border);padding:9px 16px;font:13px var(--mono);color:var(--muted);white-space:nowrap;min-height:40px;border-top:2px solid transparent}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--text);border-top-color:var(--accent)}
.crumb{font:12px var(--mono);color:var(--muted);padding:6px 16px;border-bottom:1px solid var(--border)}
.editor{flex:1;overflow:auto;padding:14px 0}
pre{margin:0;font:13.5px/1.7 var(--mono);counter-reset:l;min-width:max-content}
pre span.l{display:block;padding:0 20px 0 0;animation:in .35s ease both}
pre span.l::before{counter-increment:l;content:counter(l);display:inline-block;width:3.6em;padding-right:1.4em;text-align:right;color:var(--muted)}
pre span.l:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
@keyframes in{from{opacity:0;transform:translateX(-4px)}}
.k{color:var(--k)}.s{color:var(--s)}.n{color:var(--n)}.kw{color:var(--kw)}.c{color:var(--c)}.ty{color:var(--ty)}
.md{padding:8px 24px 24px;max-width:70ch}.md h1{font:700 clamp(1.5rem,5vw,2.2rem)/1.2 var(--sans);margin:.3em 0 .1em}
.md p{color:var(--text)}.md .role{color:var(--accent);font:600 15px var(--mono)}
.md ul{padding-left:1.1em}.md a{color:var(--accent)}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.status{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;background:var(--status);color:var(--status-ink);padding:5px 12px;font:12px var(--mono)}
@media(max-width:760px){
  .ide{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr auto}
  .act{display:none}.side{border-right:0;border-bottom:1px solid var(--border)}
  .tree{display:flex;overflow-x:auto}.tree button{white-space:nowrap;padding:6px 14px}
  .tree li{flex:none}
}
@media(prefers-reduced-motion:reduce){pre span.l{animation:none}.cursor{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#editor">Skip to editor</a>
<div class="ide">
  <div class="title"><b>vinod-profile - Visual-style editor</b><button class="toggle" id="theme" aria-pressed="false">Theme: dark</button></div>
  <div class="act" aria-hidden="true"><span>&#9776;</span><span>&#8981;</span><span>&#9095;</span><span>&#9654;</span></div>
  <aside class="side" aria-label="File explorer">
    <h2>Explorer</h2>
    <ul class="tree" role="tablist" aria-label="Files" id="tree"></ul>
  </aside>
  <div class="main">
    <div class="tabs" role="tablist" aria-label="Open editors" id="tabs"></div>
    <div class="crumb" id="crumb"></div>
    <div class="editor" id="editor" role="tabpanel" tabindex="0" aria-label="File contents"></div>
  </div>
  <div class="status"><span id="st1">main</span><span id="st2"></span><span>UTF-8</span><span>Ln <span id="ln">1</span></span></div>
</div>
<script>
// Content mirrors src/data.js (no additions).
const D={
profile:{name:'Vinod Pyarelal Yadav',tagline:'Engineering leader building mobile, IoT and enterprise platforms',role:'Custom Software Engineering Manager',company:'Accenture',linkedin:'https://www.linkedin.com/in/vinod-pyarelal-yadav-46ba1943',domains:['Mobile','IoT','Device Management','Enterprise Platforms','Web']},
stats:[{value:'14+',label:'Years in software engineering'},{value:'35+',label:'Engineers led'},{value:'3',label:'Industries: transit, healthcare, retail'}],
expertise:[
{title:'Mobile Engineering',points:['Native Android and iOS application development and delivery','Enterprise-grade mobile apps for regulated and high-usage domains']},
{title:'IoT & Connected Devices',points:['End-to-end IoT solutions spanning devices, connectivity and applications']},
{title:'MDM / EMM',points:['Mobile Device Management and Enterprise Mobility Management solutions','Managing and securing device fleets and enterprise apps at scale']},
{title:'Enterprise Software',points:['Large-scale custom software delivery for enterprise clients']},
{title:'Web Platforms',points:['Web application and platform development, including modern JavaScript/TypeScript stacks']},
{title:'Engineering Leadership',points:['Leading and scaling engineering teams (35+ engineers)','Delivery management, technical architecture, hiring and mentoring','Bridging client requirements and engineering execution']}],
experience:[{role:'Custom Software Engineering Manager',company:'Accenture',current:true,points:['Lead engineering teams delivering custom software across mobile, IoT, MDM/EMM, enterprise and web','Own technical delivery, team growth and client-facing engineering outcomes']},{role:'Earlier career',company:'HTC',current:false,points:[]}],
industries:['Transit','Healthcare','Retail'],
about:["I'm an engineering leader with 14+ years of experience designing, building and delivering software across mobile, IoT, enterprise and web platforms. I have led teams of 35+ engineers and have shipped solutions for the transit, healthcare and retail industries.","I enjoy the space where hands-on technical depth meets delivery leadership: shaping architecture, growing engineers, and turning complex requirements into reliable products."]};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(line){
  return esc(line).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|\b(export|const)\b|(\b\d+\b)|\b(true|false)\b/g,(m,str,colon,kw,num,bool)=>{
    if(str)return colon?`<span class="k">${str}</span>${colon}`:`<span class="s">${str}</span>`;
    if(kw)return `<span class="kw">${kw}</span>`;
    if(num)return `<span class="n">${num}</span>`;
    if(bool)return `<span class="kw">${bool}</span>`;return m});
}
const json=o=>JSON.stringify(o,null,2);
const FILES=[
 {n:'profile.json',i:'{}',c:'j',t:'json',body:()=>json({...D.profile,stats:D.stats,industries:D.industries})},
 {n:'expertise.ts',i:'TS',c:'t',t:'ts',body:()=>'export const expertise = '+json(D.expertise)+' as const'},
 {n:'experience.ts',i:'TS',c:'t',t:'ts',body:()=>'export const experience = '+json(D.experience)},
 {n:'README.md',i:'M',c:'m',t:'md'}];
const tree=document.getElementById('tree'),tabs=document.getElementById('tabs'),ed=document.getElementById('editor');
let cur=0;
FILES.forEach((f,idx)=>{
  const li=document.createElement('li');li.innerHTML=`<button role="tab" data-i="${idx}"><span class="ico ${f.c}">${f.i}</span>${f.n}</button>`;tree.appendChild(li);
  const b=document.createElement('button');b.role='tab';b.dataset.i=idx;b.textContent=f.n;tabs.appendChild(b)});
function show(i,focus){
  cur=i;const f=FILES[i];
  document.querySelectorAll('[role=tab]').forEach(b=>{const on=+b.dataset.i===i;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  document.getElementById('crumb').textContent='vinod-profile > src > '+f.n;
  document.getElementById('st2').textContent=f.t==='md'?'Markdown':f.t==='ts'?'TypeScript':'JSON';
  if(f.t==='md'){
    ed.innerHTML=`<div class="md"><p class="role">// ${esc(D.profile.role)} @ ${esc(D.profile.company)}</p><h1>${esc(D.profile.name)}</h1><p>${esc(D.profile.tagline)}<span class="cursor" aria-hidden="true"></span></p>${D.about.map(p=>`<p>${esc(p)}</p>`).join('')}<ul>${D.stats.map(s=>`<li><strong>${s.value}</strong> ${esc(s.label)}</li>`).join('')}</ul><p><a href="${D.profile.linkedin}" rel="noopener">LinkedIn profile</a></p></div>`;
    document.getElementById('ln').textContent=1;
  }else{
    const lines=f.body().split('\n');
    ed.innerHTML='<pre><code>'+lines.map((l,n)=>`<span class="l" style="animation-delay:${Math.min(n*12,400)}ms">${hl(l)||' '}</span>`).join('')+'</code></pre>';
    document.getElementById('ln').textContent=lines.length;
  }
  if(focus)document.querySelector(`#tabs [data-i="${i}"]`).focus();
}
document.addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(b)show(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  const b=e.target.closest('[role=tab]');if(!b)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show((cur+1)%FILES.length,true)}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show((cur+FILES.length-1)%FILES.length,true)}});
show(3);
const root=document.documentElement,tg=document.getElementById('theme');
function setT(t){root.dataset.theme=t;tg.textContent='Theme: '+t;tg.setAttribute('aria-pressed',t==='light')}
setT(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
tg.onclick=()=>setT(root.dataset.theme==='dark'?'light':'dark');
</script>
</body>
</html>
